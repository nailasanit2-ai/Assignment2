<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Tech Workshop Registration Form</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body>
<div class="form-container">
    <h1>Developer Workshop Registration</h1>

 <form id="registration-form">
    <div class="form-group">
    <label for="fullname">Full Name</label>
    <input type="text" id="fullname" name="fullname" required>
</div>

<div class="form-group">
    <label for="email">Email Address</label>
    <input type="email" id="email" name="email" required>
 </div>

<div class="form-group">
    <label for="experience">Experience Level</label>
    <select id="experience" name="experience">
    <option value="beginner">Beginner</option>
    <option value="intermediate">Intermediate</option>
    <option value="advanced">Advanced</option>
    </select>
</div>

<div class="form-group">
    <p class="group-title">Workshop Track</p>
    <div class="radio-group">
    <div class="radio-option">
    <input type="radio" id="frontend" name="track" value="frontend">
    <label for="frontend">Frontend Web</label>
</div>

<div class="radio-option">
   <input type="radio" id="backend" name="track" value="backend">
    <label for="backend">Backend APIs</label>
</div>
                    
<div class="radio-option">
    <input type="radio" id="uiux" name="track" value="uiux">
    <label for="uiux">UI/UX Design</label>
</div>
</div>
</div>

<div class="form-group checkbox-group">
    <input type="checkbox" id="updates" name="updates">
    <label for="updates">Send me event updates</label>
    
   <a href="#" class=""btn"> <p><br>View Profile</a> </p>
 </div>


 </form>
</div>

</body>

</html>
<button type="submit">Register Now</button>
</body>
</html>
